[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rebuildos"
version = "1.0.0"
description = "Works on my machine? Let's prove it. Local-first repository reproducibility and rebuild readiness diagnostic engine."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.0",
    "python-multipart>=0.0.12",
    "PyYAML>=6.0.2",
    "httpx>=0.27.0"
]

[project.scripts]
rebuildos = "rebuildos.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
